<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Վարորդական քննություն</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Crect width='3' height='1' fill='%23D90012'/%3E%3Crect y='1' width='3' height='1' fill='%230033A0'/%3E%3Crect y='2' width='3' height='1' fill='%23F2A800'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Any uncaught error (bad data, storage full) is shown on the page, not only in the console.
      ;(function () {
        function show(msg) {
          var el = document.createElement('div')
          el.className = 'fatal'
          el.textContent = 'Սխալ առաջացավ. ' + msg + '\nՎերջին գործողությունը կարող է չպահպանվել։ Թարմացրու էջը. եթե սխալը կրկնվի, Առաջընթաց էջից արտահանիր տվյալները։'
          document.body.appendChild(el)
        }
        window.addEventListener('error', function (e) { show(e.message) })
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
