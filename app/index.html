<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Վարորդական քննություն</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Before the first paint, so a saved theme never flashes the other one.
      ;(function () {
        var s = JSON.parse(localStorage.getItem('armenia-driving-test.settings.v1') || '{}')
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme
        if (s.textSize === 'large') document.documentElement.dataset.size = 'large'
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Any uncaught error (bad data, storage full) is shown on the page, not only in the console.
      ;(function () {
        function show(msg) {
          var el = document.createElement('div')
          el.className = 'fatal'
          el.textContent = 'Սխալ առաջացավ. ' + msg + '\nՎերջին գործողությունը կարող է չպահպանվել։ Թարմացրու էջը. եթե սխալը կրկնվի, Առաջընթաց էջից արտահանիր տվյալները։'
          document.body.appendChild(el)
        }
        window.addEventListener('error', function (e) { show(e.message) })
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
